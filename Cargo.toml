[workspace]
members = [
    "packages/rswebgl",
    "packages/rswebgl-gltf",
    "examples/cube",
    "examples/cubemap",
    "examples/texture",
    "examples/gltf",
]
resolver = "3"

[workspace.dependencies]
rswebgl = { path = "packages/rswebgl" }
smallvec = "1"
wasm-bindgen = "0.2"
web-sys = "0.3"
js-sys = "0.3"
glam = "0.30"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
