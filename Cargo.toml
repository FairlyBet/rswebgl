[workspace]
members = [
    "packages/rswebgl",
    "packages/rswebgl-gltf",
    "packages/rswebgl-foundation",
    "packages/rswebgl-ecs",
    "packages/rswebgl-scene",
    "examples/cube",
    "examples/cubemap",
    "examples/texture",
    "examples/gltf",
    "examples/scene",
]
resolver = "3"

[workspace.dependencies]
rswebgl = { path = "packages/rswebgl" }
smallvec = "1"
wasm-bindgen = "0.2"
web-sys = "0.3"
js-sys = "0.3"
glam = "0.30"
tracing = { version = "0.1", default-features = false, features = ["std"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
