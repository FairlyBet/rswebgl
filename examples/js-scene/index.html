<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>rswebgl: glTF scene from plain JS</title>
  <style>
    html,
    body {
      margin: 0;

      height: 100%;
      overflow: hidden;

  <canvas id="c"></canvas>

</html>
